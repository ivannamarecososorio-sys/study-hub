<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Study Space 🎀</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#df5f98">
</head>

<body>

    <div class="container">

       <h1>Study Space 🎀</h1>

        <p class="subtitle">
            Organiza tus estudios y alcanza tus metas ✨
        </p>

        <div class="stats">
            <div class="stat">
    <div class="stat-number" id="racha">🔥 0</div>
    <p>Racha</p>
</div>

            <div class="stat">
    <div class="stat-number" id="progreso">0%</div>
    <p>Progreso</p>

    <div class="barra">
        <div class="barra-relleno" id="barra-relleno"></div>
    </div>
</div>

    
        </div>

        <div class="card">
            <div class="card">
    <h2>🎯 Mis metas de hoy</h2>

    <div class="meta">
        <span>📚 Completar 3 tareas</span>
        <span id="metaTareas">0 / 3</span>
    </div>

    <div class="barra">
        <div class="barra-relleno" id="barraMetas"></div>
    </div>

    <p id="mensajeMeta">¡Vamos, tú puedes! 🎀</p>
</div>
<div class="card">
    <h2>📅 Esta semana</h2>

    <div class="semana" id="semana"></div>
</div>

</div>

            <h2>📚 Mis tareas</h2>

            <input 
                type="text" 
                id="tarea" 
                placeholder="Escribe una tarea..."
            >

            <button id="agregar">
                ➕ Agregar
            </button>

            <ul id="lista"></ul>

        </div>

        <div class="card">

    <h2>⏱️ Study Timer</h2>

    <div class="tiempos">
        <button class="boton-tiempo" data-tiempo="900">15 min</button>
        <button class="boton-tiempo" data-tiempo="1500">25 min</button>
        <button class="boton-tiempo" data-tiempo="2700">45 min</button>
        <button class="boton-tiempo" data-tiempo="3600">60 min</button>
    </div>

    <div id="temporizador">
        25:00
    </div>

    <button id="iniciar">
        ▶️ Empezar
    </button>

    <button id="reiniciar">
        🔄 Reiniciar
    </button>

</div>

    <script src="script.js"></script>

</body>
</html>
